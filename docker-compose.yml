services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  ragchain:
    build:
      context: ./ragchain
    restart: unless-stopped
    env_file:
      - ./ragchain/.env.production
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - ragchain
    env_file:
      - ./backend/.env.production
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8443:8443" # nginx port for frontend
    depends_on:
      - backend

volumes:
  redis_data:
